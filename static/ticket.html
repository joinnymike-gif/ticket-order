<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5ab9ff">
<meta name="robots" content="noindex,nofollow">
<title>チケット控え</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><div class="wrap"><b>チケット控え</b><a href="/">受付ページ</a></div></header>
<div class="wrap">
  <div id="err" class="msg err hide">チケットが見つかりません。コードをご確認ください。</div>
  <div id="box" class="hide">
    <h1 id="who"></h1>
    <p class="sub">お申し込みは完了しています。</p>
    <div class="card">
      <img id="shot" class="shot" alt="チケット控え">
    </div>
    <div class="card">
      <a id="live" target="_blank" rel="noopener"><button>入場用チケット画面を開く</button></a>
      <small style="margin-top:.8rem">
        ※入場時は必ずこのボタンからご自身で開いてご提示ください。<br>
        ※上の画像は控えです。画像やスクリーンショットの提示では入場をお断りする場合があります。<br>
        ※このページのURLはあなた専用です。他人に共有しないでください。
      </small>
    </div>
  </div>
</div>
<script>
const token = location.pathname.split("/")[2] || "";
fetch("/api/status?token=" + encodeURIComponent(token))
  .then((r) => r.ok ? r.json() : Promise.reject())
  .then((d) => {
    if (!d.shot || d.status !== "sent") return Promise.reject();
    document.getElementById("who").textContent = d.nickname + " 様";
    document.getElementById("shot").src = "/t/" + encodeURIComponent(token) + ".png";
    document.getElementById("live").href = "https://ticketdive.com/ticket/" + d.ticket_id;
    document.getElementById("box").classList.remove("hide");
  })
  .catch(() => document.getElementById("err").classList.remove("hide"));
</script>
</body>
</html>
